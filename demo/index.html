<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seaview Properties · AI assistant demo</title>
<meta name="description" content="Try an AI assistant answering buyer and renter enquiries for a fictional South African estate agency. A demo by Reply First Digital.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centred chat column; a quiet demo band on top, agency header, thread, composer pinned at the bottom */
:root{
  --bg:#eef1ee; --surface:#ffffff; --line:#d7ddd8; --fg:#1b2420; --muted:#5d6a63;
  --brand:#14524a; --brand-ink:#ffffff; --bubble:#e6efec; --accent:#c9862e; --err:#a33d32;
  --f-display:"Fraunces", Georgia, serif; --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111715; --surface:#18201d; --line:#2c3632; --fg:#e7ece9; --muted:#97a59e;
  --brand:#5fb3a5; --brand-ink:#0c1513; --bubble:#203029; --accent:#e0a453; --err:#ef8a7e; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);display:flex;flex-direction:column}
.demo{background:var(--fg);color:var(--bg);font-size:13px;text-align:center;padding:8px 16px}
.demo a{color:inherit;font-weight:600}
.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:720px;margin:0 auto;min-height:0;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
header{display:flex;align-items:center;gap:12px;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:600 18px var(--f-display)}
header h1{font:600 20px/1.2 var(--f-display);margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3aa76d;margin-right:6px;vertical-align:middle}
#thread{flex:1;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.zara{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:4px}
.you{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.err{align-self:center;color:var(--err);font-size:14px;text-align:center;max-width:90%}
.typing{align-self:flex-start;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 10px}
.chips button{font:500 14px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:7px 12px;cursor:pointer}
.chips button:hover{border-color:var(--brand)}
form{display:flex;gap:8px;padding:12px 0 max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:24px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.send{font:600 15px var(--f-body);background:var(--accent);color:#1b1306;border:0;border-radius:24px;padding:0 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-bottom:10px}
</style>
</head>
<body>
<div class="demo">Live demo: Seaview Properties is a fictional agency. Please don't share real personal details. Built by <a href="../#agencies" target="_blank" rel="noopener">Reply First Digital</a>.</div>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">S</div>
    <div><h1>Seaview Properties</h1><p><span class="dot"></span>Zara, AI assistant · replies in seconds, day or night</p></div>
  </header>
  <div id="thread" aria-live="polite"></div>
  <div class="chips" id="chips">
    <button type="button">Any 3-bed homes under R3.5m?</button>
    <button type="button">I want to rent in Umhlanga</button>
    <button type="button">Can I view the Ballito townhouse on Saturday?</button>
    <button type="button">I'm an agent. How does this work?</button>
  </div>
  <form id="f">
    <input id="q" aria-label="Your message" autocomplete="off" maxlength="600" placeholder="Ask about a property…">
    <button class="send" id="send">Send</button>
  </form>
  <p class="foot">Answers come from an AI and may be imperfect. Nothing is booked in this demo.</p>
</div>
<script>
// Set this to your Supabase project's function URL.
const ENDPOINT = "https://pknolndnumfnnyysvelf.supabase.co/functions/v1/demo-chat";
const thread = document.getElementById("thread"), q = document.getElementById("q"), send = document.getElementById("send");
const history = [];
function add(cls, text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;thread.appendChild(d);thread.scrollTop=thread.scrollHeight;return d}
add("zara","Hi, I'm Zara, Seaview Properties' AI assistant. Are you looking to buy or rent, and in which area?");
history.push({role:"assistant",content:"Hi, I'm Zara, Seaview Properties' AI assistant. Are you looking to buy or rent, and in which area?"});
async function ask(text){
  text=text.trim(); if(!text||send.disabled) return;
  document.getElementById("chips").hidden=true;
  add("you",text); history.push({role:"user",content:text}); q.value="";
  send.disabled=true; const t=add("typing","Zara is typing…"); t.className="typing";
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history})});
    const j=await r.json().catch(()=>({}));
    t.remove();
    if(!r.ok||!j.reply){ add("err",j.error||"Zara couldn't answer just now. Please try again."); history.pop(); }
    else { add("zara",j.reply); history.push({role:"assistant",content:j.reply}); }
  }catch{ t.remove(); add("err","Couldn't reach Zara. Check your connection and try again."); history.pop(); }
  send.disabled=false; q.focus();
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();ask(q.value)});
document.querySelectorAll("#chips button").forEach(b=>b.addEventListener("click",()=>ask(b.textContent)));
</script>
</body>
</html>
